# Mobil uygulama (Flutter): her değişiklikte analiz + test, ardından test sunucusuna bağlı Android APK.
# APK, çalıştırmanın "Artifacts" bölümünden indirilir (14 gün saklanır) ve "mobil-test" sürümüne
# hafiz-takip.apk adıyla yüklenir: web sitesindeki /mobil sayfasının "Uygulamayı indir" düğmesi bu dosyayı indirir.
name: Mobil APK

on:
  push:
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API adresi'
        required: false
        default: 'https://hafiztakip.api.yasirsharp.com.tr'

permissions:
  contents: write   # mobil-test sürümüne APK yüklemek için

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/mobile
    env:
      API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://hafiztakip.api.yasirsharp.com.tr' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Paketler
        run: flutter pub get

      - name: Analiz
        run: flutter analyze

      - name: Testler
        run: flutter test --concurrency=1

      - name: APK
        run: >
          flutter build apk --release
          --target-platform android-arm,android-arm64
          --dart-define=API_BASE_URL=$API_BASE_URL
          --build-name=0.1.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: hafiz-takip-${{ github.run_number }}
          path: frontend/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: İndirme sayfasına yayınla (mobil-test)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NO: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk hafiz-takip.apk
          if ! gh release view mobil-test >/dev/null 2>&1; then
            gh release create mobil-test --prerelease --title "Hafız Takip — Android test sürümü" --notes "İlk yayın"
          fi
          gh release upload mobil-test hafiz-takip.apk --clobber
          gh release edit mobil-test --notes "Sürüm 0.1.$RUN_NO — $(date -u +%Y-%m-%d) — commit ${SHA::7}. Test sunucusuna bağlıdır. İndirme ve kurulum: https://hafiztakip.yasirsharp.com.tr/mobil"
