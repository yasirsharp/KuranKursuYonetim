# Mobil uygulama (Flutter): her değişiklikte analiz + test, ardından test sunucusuna bağlı Android APK.
# APK, çalıştırmanın "Artifacts" bölümünden indirilir (14 gün saklanır).
name: Mobil APK

on:
  push:
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API adresi'
        required: false
        default: 'https://hafiztakip.api.yasirsharp.com.tr'

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/mobile
    env:
      API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://hafiztakip.api.yasirsharp.com.tr' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Paketler
        run: flutter pub get

      - name: Analiz
        run: flutter analyze

      - name: Testler
        run: flutter test --concurrency=1

      - name: APK
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=$API_BASE_URL
          --build-name=0.1.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: hafiz-takip-${{ github.run_number }}
          path: frontend/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
